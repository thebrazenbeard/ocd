name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23.x", "1.24.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test repository-contained source
        env:
          GOFLAGS: -mod=vendor
        run: |
          go test ./...
          go vet ./...

  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Validate install script
        run: sh -n package-source/scripts/postinst
      - name: Build and verify repository-contained SPK twice
        run: |
          bash scripts/build-spk.sh dist/OCD-a.spk
          bash scripts/build-spk.sh dist/OCD-b.spk
          cmp dist/OCD-a.spk dist/OCD-b.spk
          sha256sum package-source/payload/bin/ocd dist/OCD-a.spk
      - uses: actions/upload-artifact@v4
        with:
          name: OCD-armada38x-${{ github.sha }}
          path: dist/OCD-a.spk
