name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23.x", "1.24.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test ./...
      - run: go vet ./...

  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/checkout@v4
        with:
          repository: thebrazenbeard/spk-packager
          ref: dbda5bca7a18d919346f52d8401a00c6fd530b88
          path: .spk-packager
      - name: Build deterministic ARMv7 payload
        run: |
          mkdir -p package-source/payload/bin dist
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid= -X github.com/thebrazenbeard/ocd/internal/buildinfo.Version=0.1.0-0001' -o package-source/payload/bin/ocd ./cmd/ocd
      - name: Validate install script
        run: sh -n package-source/scripts/postinst
      - name: Build and verify SPK twice
        env:
          PYTHONPATH: ${{ github.workspace }}/.spk-packager/src
        run: |
          python -m spk_packager.cli lint package-source/spk-packager.toml
          python -m spk_packager.cli build package-source/spk-packager.toml --output dist/OCD-a.spk
          python -m spk_packager.cli build package-source/spk-packager.toml --output dist/OCD-b.spk
          cmp dist/OCD-a.spk dist/OCD-b.spk
          python -m spk_packager.cli verify dist/OCD-a.spk
          sha256sum package-source/payload/bin/ocd dist/OCD-a.spk
      - uses: actions/upload-artifact@v4
        with:
          name: OCD-armada38x
          path: dist/OCD-a.spk
